name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Unit, acceptance and architecture suites. -count=1 defeats the test
      # result cache, so a green run always reflects the commit it ran on.
      # -coverpkg is needed because the suites live outside the packages they
      # exercise.
      - name: Test
        run: go test -count=1 -coverpkg=./... ./...

      # Concurrency correctness is not established by ordinary tests passing.
      - name: Race
        run: go test -race -count=1 ./...

      # The lifecycle-heavy cases are the ones that fail intermittently, so they
      # are repeated rather than run once.
      - name: Concurrency stress
        run: >
          go test -race -count=25
          -run 'Scope|Fiber|Fork|Await|Join|Poll|Interrupt|Ensuring|OnExit|ZipPar|Race|Timeout|ForEach|All|Channel|Daemon|Capability|Ownership'
          ./test/unit/
      - name: Acceptance stress
        run: go test -race -count=10 ./test/acceptance/

      # The sequencing benchmarks gate an experimental API on measured cost, so
      # they must keep compiling and running even though CI does not judge the
      # numbers.
      - name: Benchmarks
        run: go test -run '^$' -bench . -benchtime 1000x ./test/benchmark/

      # The examples must remain runnable programs, not only test fixtures.
      - name: Examples
        run: go run ./examples/cmd/effectdemo
